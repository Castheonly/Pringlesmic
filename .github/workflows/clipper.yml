name: Auto Clipper
run-name: "${{ inputs.url && format('Clip manual - {0}', inputs.url) || (inputs.only_intake && 'Revisar campañas nuevas' || 'Clipping programado') }}"

on:
  schedule:
    - cron: "17 */4 * * *"     # cada 4 horas (hora UTC)
  workflow_dispatch:
    inputs:
      url:
        description: "Procesar solo este video o canal (opcional)"
        required: false
      campaign:
        description: "Campaña a usar (reglas, hashtags, cuentas)"
        required: false
      no_publish:
        description: "Solo generar clips, sin publicar"
        type: boolean
        default: false
      only_intake:
        description: "Solo revisar campañas nuevas (no generar clips)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-clipper
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # 1) Revisa campañas nuevas, actualiza el radar de tendencias y arma la lista de videos nuevos
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q anthropic pyyaml requests "yt-dlp[default,curl-cffi]>=2026.10.26"
      - name: Cookies de YouTube (opcional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; echo "YT_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"; fi
      - name: Revisar campañas nuevas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m clipper.campaign_intake
      - name: Buscar videos nuevos (+ radar de tendencias)
        id: plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
          ONLY_INTAKE: ${{ inputs.only_intake }}
        run: |
          if [ "$ONLY_INTAKE" = "true" ]; then echo "jobs=[]" >> "$GITHUB_OUTPUT"; echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          ARGS=()
          [ -n "$INPUT_URL" ] && ARGS+=(--url "$INPUT_URL")
          [ -n "$INPUT_CAMPAIGN" ] && ARGS+=(--campaign "$INPUT_CAMPAIGN")
          python -m clipper.main --plan jobs.json "${ARGS[@]}"
          echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json;print(len(json.load(open("jobs.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Guardar campañas y tendencias
        run: |
          git config user.name "auto-clipper"
          git config user.email "actions@users.noreply.github.com"
          git add state/ config.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Campañas y tendencias actualizadas [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

  # 2) Un video por máquina, en paralelo
  clip:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat
      - run: pip install -q -r requirements.txt
      - name: Cache de modelos (Whisper + detector de caras)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/clipper
          key: models-v1
      - name: Cookies de YouTube (opcional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; echo "YT_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"; fi
      - name: Generar clips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOB: ${{ toJSON(matrix.job) }}
        run: python -m clipper.main --clip "$JOB"
      - name: Nombre del artefacto
        if: always()
        id: name
        env:
          CAMP: ${{ matrix.job.campaign }}
          VID: ${{ matrix.job.video.id }}
        run: echo "name=clips-$(printf '%s-%s' "$CAMP" "$VID" | tr -c 'A-Za-z0-9_-' '_' | cut -c1-90)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  # 3) Publica todo en orden (mejor score primero) y guarda el registro
  publish:
    needs: [plan, clip]
    if: always() && needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q anthropic pyyaml requests cryptography "yt-dlp[default,curl-cffi]>=2026.10.26"
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: collected/
          merge-multiple: true
      - name: Publicar y registrar
        env:
          ACCOUNTS_KEY: ${{ secrets.ACCOUNTS_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCOUNTS_JSON: ${{ secrets.TIKTOK_ACCOUNTS_JSON }}
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          INPUT_NO_PUBLISH: ${{ inputs.no_publish }}
          PLANNED: ${{ needs.plan.outputs.jobs }}
        run: |
          printf '%s' "$PLANNED" > planned.json
          ARGS=(--planned planned.json)
          [ "$INPUT_NO_PUBLISH" = "true" ] && ARGS+=(--no-publish)
          mkdir -p collected
          python -m clipper.main --publish collected "${ARGS[@]}"
      - name: Todos los clips de esta corrida en un solo zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todos-los-clips
          path: collected/
          retention-days: 7
          if-no-files-found: ignore
      - name: Guardar registro
        if: always()
        run: |
          git config user.name "auto-clipper"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Registro de clips [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
