name: Clips en vivo
run-name: "Directos en vivo"

on:
  schedule:
    - cron: "*/20 * * * *"     # cada 20 minutos revisa quién está en vivo
  workflow_dispatch:
    inputs:
      no_publish:
        description: "Solo generar clips, sin publicar"
        type: boolean
        default: false

permissions:
  contents: write

# una ronda a la vez: mientras graba, la siguiente queda en espera y arranca apenas termina
concurrency:
  group: live-clipper
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.check.outputs.jobs }}
      count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q anthropic pyyaml "yt-dlp[default,curl-cffi]>=2026.10.26"
      - name: Cookies de YouTube (opcional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; echo "YT_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"; fi
      - name: ¿Quién está en vivo?
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m clipper.live --check jobs.json
          echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json;print(len(json.load(open("jobs.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Registrar directos grabados
        run: scripts/save_state.sh "Directos en vivo"

  record:
    needs: check
    if: needs.check.outputs.count != '0' && needs.check.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        job: ${{ fromJSON(needs.check.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat
      - run: pip install -q -r requirements.txt
      - name: Cache de modelos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/clipper
          key: models-v1
      - name: Cookies de YouTube (opcional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; echo "YT_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"; fi
      - name: Grabar y recortar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOB: ${{ toJSON(matrix.job) }}
        run: python -m clipper.live --record "$JOB"
      - name: Nombre del artefacto
        if: always()
        id: name
        env:
          VID: ${{ matrix.job.video.id }}
        run: echo "name=clips-$(printf '%s' "$VID" | tr -c 'A-Za-z0-9_-' '_' | cut -c1-90)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [check, record]
    if: always() && needs.check.outputs.count != '0' && needs.check.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q anthropic pyyaml requests cryptography "yt-dlp[default,curl-cffi]>=2026.10.26"
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: collected/
          merge-multiple: true
      - name: Publicar y registrar
        env:
          ACCOUNTS_KEY: ${{ secrets.ACCOUNTS_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCOUNTS_JSON: ${{ secrets.TIKTOK_ACCOUNTS_JSON }}
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          INPUT_NO_PUBLISH: ${{ inputs.no_publish }}
          PLANNED: ${{ needs.check.outputs.jobs }}
        run: |
          printf '%s' "$PLANNED" > planned.json
          ARGS=(--planned planned.json)
          [ "$INPUT_NO_PUBLISH" = "true" ] && ARGS+=(--no-publish)
          mkdir -p collected
          python -m clipper.main --publish collected "${ARGS[@]}"
      - name: Todos los clips de esta ronda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todos-los-clips
          path: collected/
          retention-days: 7
          if-no-files-found: ignore
      - name: Guardar registro
        if: always()
        run: scripts/save_state.sh "Registro de clips en vivo"
